[package]
name = "tycho-state-updater"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
blake3 = "1.8.4"
clap = { version = "4.6.0", features = ["derive"] }
memmap2 = "0.9.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tycho-types = { git = "https://github.com/broxus/tycho-types.git", features = ["tycho"] }
